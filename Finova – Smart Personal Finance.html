<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finova – Smart Personal Finance</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f7fa;--card:#fff;--tx:#1c2430;--mut:#6b7686;--ln:#e3e8ef;--br:#0f766e;--pos:#15803d;--neg:#b91c1c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#18202a;--tx:#e6ebf2;--mut:#93a0b2;--ln:#263140;--br:#2dd4bf;--pos:#4ade80;--neg:#f87171}}
:root[data-theme="dark"]{--bg:#10151c;--card:#18202a;--tx:#e6ebf2;--mut:#93a0b2;--ln:#263140;--br:#2dd4bf;--pos:#4ade80;--neg:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
h1,h2,h3{margin:0 0 .7rem}.mut{color:var(--mut)}.pos{color:var(--pos)}.neg{color:var(--neg)}
header{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;padding:.7rem 1rem;background:var(--card);border-bottom:1px solid var(--ln)}
header h1{margin:0;color:var(--br)}nav{display:flex;gap:.2rem;flex:1;flex-wrap:wrap}
nav button{border:0;background:none;color:var(--mut);padding:.5rem .8rem;border-radius:8px}
nav button.on,nav button:hover{background:var(--bg);color:var(--tx)}
main{max-width:980px;margin:0 auto;padding:1.1rem}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:1rem;margin-bottom:1rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem;margin-bottom:1rem}
.stats .card{margin:0;display:flex;flex-direction:column;gap:.2rem}.stats b{font-size:1.5rem}.stats span{color:var(--mut);font-size:.85rem}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}.g2 .card{margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:.7rem}
.item{padding:.55rem 0;border-bottom:1px solid var(--ln)}.item:last-child{border:0}
.form{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
input,select,button{font:inherit;padding:.5rem .7rem;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
button{background:var(--card);cursor:pointer}button.p{background:var(--br);border-color:var(--br);color:#fff;font-weight:600}
button.l{background:none;border:0;padding:0;color:var(--br)}button.d{color:var(--neg)}
.acts{display:flex;gap:.8rem;align-items:center}
.err{background:#fee2e2;color:#991b1b;padding:.6rem .8rem;border-radius:8px;margin-bottom:1rem}
.bar{height:8px;background:var(--ln);border-radius:99px;overflow:hidden;margin:.3rem 0}.bar i{display:block;height:100%;background:var(--br)}.bar i.o{background:var(--neg)}
.auth{min-height:80vh;display:grid;place-items:center;padding:1rem}.auth form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:.7rem}
.auth h1{color:var(--br);margin:0}footer{text-align:center;color:var(--mut);font-size:.8rem;padding:1rem}
</style>
</head>
<body>
<div id="app"></div>
<footer>Finova runs entirely in your browser — accounts and data are stored on this device only.</footer>
<script>
/* ===== "Backend": REST-style API layer (controller → service → repository) running in the browser ===== */
class ApiError extends Error{constructor(s,m){super(m);this.status=s}}
const ok=(c,m,s=400)=>{if(!c)throw new ApiError(s,m)};
const sleep=()=>new Promise(r=>setTimeout(r,25));
const r2=n=>Math.round(n*100)/100;
const fresh=()=>({users:[],cats:[],tx:[],bud:[],ses:{},seq:1});
const ls={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};
let DB;try{DB=JSON.parse(ls.get('finova_db'))||fresh()}catch{DB=fresh()}
const save=()=>ls.set('finova_db',JSON.stringify(DB));
const nid=()=>DB.seq++;
const DEF={INCOME:['Salary','Freelance'],EXPENSE:['Food','Rent','Transport','Utilities','Entertainment']};
async function hash(pw,salt){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+pw));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function session(u){const token=crypto.randomUUID()+crypto.randomUUID();DB.ses[token]={uid:u.id,exp:Date.now()+864e5};return{token,name:u.name,email:u.email}}
function authed(t){const s=DB.ses[t];ok(s&&s.exp>Date.now(),'Unauthorized',401);return DB.users.find(u=>u.id===s.uid)}
const nf=x=>{const n=Number(x);ok(Number.isFinite(n)&&n>=0.01&&n<=1e12,'amount must be at least 0.01');return r2(n)};

async function authRoute(a,b){
  const email=String(b.email||'').trim().toLowerCase();
  ok(/^\S+@\S+\.\S+$/.test(email),'email must be valid');
  if(a==='register'){
    const name=String(b.name||'').trim(),pw=String(b.password||'');
    ok(name&&name.length<=100,'name is required');
    ok(pw.length>=8&&pw.length<=72,'password must be 8-72 characters');
    ok(!DB.users.some(u=>u.email===email),'An account with this email already exists',409);
    const salt=crypto.randomUUID(),u={id:nid(),name,email,salt,hash:await hash(pw,salt)};
    DB.users.push(u);
    for(const t in DEF)DEF[t].forEach(n=>DB.cats.push({id:nid(),uid:u.id,name:n,type:t}));
    return session(u);
  }
  if(a==='login'){
    const u=DB.users.find(x=>x.email===email);
    ok(u&&u.hash===await hash(String(b.password||''),u.salt),'Invalid email or password',401);
    return session(u);
  }
  ok(false,'Not found',404);
}
const catOf=(uid,id)=>DB.cats.find(c=>c.id===id&&c.uid===uid);
const catOut=c=>({id:c.id,name:c.name,type:c.type});
const txOut=x=>({id:x.id,type:x.type,amount:x.amount,description:x.description,date:x.date,categoryId:x.categoryId,categoryName:catOf(x.uid,x.categoryId)?.name||null});
const cmp=(a,b)=>b.date.localeCompare(a.date)||b.id-a.id;
function budOut(b){
  const pre=`${b.year}-${String(b.month).padStart(2,'0')}`;
  const spent=r2(DB.tx.filter(x=>x.uid===b.uid&&x.type==='EXPENSE'&&x.categoryId===b.categoryId&&x.date.startsWith(pre)).reduce((s,x)=>s+x.amount,0));
  const remaining=r2(b.limitAmount-spent);
  return{id:b.id,categoryId:b.categoryId,categoryName:catOf(b.uid,b.categoryId)?.name,year:b.year,month:b.month,limitAmount:b.limitAmount,spent,remaining,percentUsed:Math.round(spent*1000/b.limitAmount)/10,exceeded:remaining<0};
}
function crud(m,id,b,u,arr,o){
  const mine=()=>DB[arr].filter(x=>x.uid===u.id&&(!o.scope||o.scope(x)));
  if(m==='GET'&&!id)return o.list(mine());
  if(m==='POST'){const x={id:nid(),uid:u.id,...o.pick(b,u,null)};DB[arr].push(x);return o.out(x)}
  const x=mine().find(y=>y.id===id);ok(x,o.nf,404);
  if(m==='PUT'){Object.assign(x,o.pick(b,u,x));return o.out(x)}
  if(m==='DELETE'){o.del?.(x);DB[arr]=DB[arr].filter(y=>y!==x);return null}
  ok(false,'Not found',404);
}
const localYM=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`};
function dash(u){
  const t=DB.tx.filter(x=>x.uid===u.id),ym=localYM();
  const sum=f=>r2(t.filter(f).reduce((s,x)=>s+x.amount,0));
  const I=x=>x.type==='INCOME',E=x=>x.type==='EXPENSE',[y,m]=ym.split('-').map(Number);
  const ti=sum(I),te=sum(E);
  return{totalIncome:ti,totalExpense:te,balance:r2(ti-te),monthIncome:sum(x=>I(x)&&x.date.startsWith(ym)),monthExpense:sum(x=>E(x)&&x.date.startsWith(ym)),
    recent:[...t].sort(cmp).slice(0,5).map(txOut),budgets:DB.bud.filter(b=>b.uid===u.id&&b.year===y&&b.month===m).map(budOut)};
}
function route(m,r,sid,b,q,u){
  const id=sid?Number(sid):null;
  if(r==='dashboard')return dash(u);
  if(r==='categories')return crud(m,id,b,u,'cats',{nf:'Category not found',out:catOut,list:a=>a.sort((x,y)=>x.name.localeCompare(y.name)).map(catOut),
    pick(b,u,x){const name=String(b.name||'').trim(),type=b.type;ok(name&&name.length<=50,'name is required');ok(type in DEF,'type must be INCOME or EXPENSE');
      ok(!DB.cats.some(c=>c!==x&&c.uid===u.id&&c.type===type&&c.name.toLowerCase()===name.toLowerCase()),'Category already exists',409);return{name,type}},
    del(x){ok(!DB.tx.some(t=>t.categoryId===x.id)&&!DB.bud.some(t=>t.categoryId===x.id),'Operation conflicts with existing data (item is in use)',409)}});
  if(r==='incomes'||r==='expenses'){const type=r==='incomes'?'INCOME':'EXPENSE';
    return crud(m,id,b,u,'tx',{nf:'Transaction not found',out:txOut,scope:x=>x.type===type,list:a=>a.sort(cmp).map(txOut),
      pick(b){const desc=String(b.description||'').trim();ok(desc.length<=255,'description too long');ok(/^\d{4}-\d\d-\d\d$/.test(b.date||''),'date is required');
        const cid=b.categoryId?Number(b.categoryId):null;
        if(cid){const c=catOf(u.id,cid);ok(c,'Category not found',404);ok(c.type===type,'Category type must be '+type)}
        return{type,amount:nf(b.amount),description:desc,date:b.date,categoryId:cid}}});}
  if(r==='budgets'){const y=Number(q.get('year'))||+localYM().slice(0,4),mo=Number(q.get('month'))||+localYM().slice(5);
    return crud(m,id,b,u,'bud',{nf:'Budget not found',out:budOut,list:a=>a.filter(x=>x.year===y&&x.month===mo).map(budOut),
      pick(b,u,x){const c=catOf(u.id,Number(b.categoryId));ok(c,'Category not found',404);ok(c.type==='EXPENSE','Budgets can only be set for expense categories');
        const year=Number(b.year),month=Number(b.month);ok(year>=2000&&year<=2100&&month>=1&&month<=12,'invalid month');
        ok(!DB.bud.some(z=>z!==x&&z.uid===u.id&&z.categoryId===c.id&&z.year===year&&z.month===month),'A budget for this category and month already exists',409);
        return{categoryId:c.id,year,month,limitAmount:nf(b.limitAmount)}}});}
  ok(false,'Not found',404);
}
async function api(method,path,body={},token){
  await sleep();
  const[p,qs]=path.split('?'),q=new URLSearchParams(qs||''),[r,sub]=p.split('/').filter(Boolean);
  const out=r==='auth'?await authRoute(sub,body):route(method,r,sub,body,q,authed(token));
  save();return out;
}

/* ===== Frontend ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>{const d=new Date();return`${localYM()}-${String(d.getDate()).padStart(2,'0')}`};
let saved={};try{saved=JSON.parse(ls.get('finova_session'))||{}}catch{}
const S={token:saved.token,name:saved.name,page:'dashboard',mode:'login',edit:null,month:localYM()};
if(S.token&&!DB.ses[S.token])S.token=null;
const call=(m,p,b)=>api(m,p,b,S.token).catch(e=>{if(e.status===401&&S.token)logout();throw e});
function logout(){S.token=null;ls.del('finova_session');render()}
function flash(msg){const e=$('#err');if(e){e.textContent=msg;e.hidden=false}}
const stat=(l,v,c='',s='')=>`<div class="card"><span>${l}</span><b class="${c}">${v}</b>${s}</div>`;
const txRow=t=>`<div class="row item"><div><b>${esc(t.description||t.categoryName||t.type)}</b> <small class="mut">${t.date}${t.categoryName?' · '+esc(t.categoryName):''}</small></div><b class="${t.type==='INCOME'?'pos':'neg'}">${t.type==='INCOME'?'+':'−'}${money(t.amount)}</b></div>`;
const bar=b=>`<div class="item"><div class="row"><b>${esc(b.categoryName)}</b><span class="${b.exceeded?'neg':'mut'}">${money(b.spent)} / ${money(b.limitAmount)}</span></div><div class="bar"><i class="${b.exceeded?'o':''}" style="width:${Math.min(b.percentUsed,100)}%"></i></div><small class="${b.exceeded?'neg':'mut'}">${b.exceeded?'Over by '+money(-b.remaining):money(b.remaining)+' left'}</small></div>`;
const opts=(cs,sel)=>cs.map(c=>`<option value="${c.id}" ${sel===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
const kindOf=()=>S.page==='incomes'?'incomes':'expenses';

const txPage=(type,title)=>async()=>{
  const kind=type==='INCOME'?'incomes':'expenses';
  const[items,cats]=await Promise.all([call('GET','/'+kind),call('GET','/categories')]);
  const e=S.edit&&items.find(i=>i.id===S.edit)||{};
  return`<h2>${title}</h2><form class="card form" data-form="tx">
    <input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount" value="${e.amount??''}" required>
    <input name="description" maxlength="255" placeholder="Description" value="${esc(e.description)}" style="flex:1;min-width:150px">
    <input name="date" type="date" value="${e.date||today()}" required>
    <select name="categoryId"><option value="">No category</option>${opts(cats.filter(c=>c.type===type),e.categoryId)}</select>
    <button class="p">${S.edit?'Save':'Add'}</button>${S.edit?'<button type="button" data-act="cancel">Cancel</button>':''}</form>
    <section class="card">${items.map(t=>`<div class="row item"><div><b>${esc(t.description||t.categoryName||title)}</b> <small class="mut">${t.date}${t.categoryName?' · '+esc(t.categoryName):''}</small></div>
      <div class="acts"><b class="${type==='INCOME'?'pos':'neg'}">${money(t.amount)}</b><button class="l" data-act="edit" data-id="${t.id}">Edit</button><button class="l d" data-act="del" data-id="${t.id}">Delete</button></div></div>`).join('')||'<p class="mut">No records yet.</p>'}</section>`;
};
const pages={
  dashboard:async()=>{const d=await call('GET','/dashboard');
    return`<div class="stats">${stat('Balance',money(d.balance),d.balance<0?'neg':'')}${stat('Total income',money(d.totalIncome),'pos')}${stat('Total expenses',money(d.totalExpense),'neg')}${stat('This month',money(d.monthIncome-d.monthExpense),'',`<small class="mut">+${money(d.monthIncome)} / −${money(d.monthExpense)}</small>`)}</div>
    <div class="g2"><section class="card"><h2>Recent transactions</h2>${d.recent.map(txRow).join('')||'<p class="mut">Nothing recorded yet.</p>'}</section>
    <section class="card"><h2>Budgets this month</h2>${d.budgets.map(bar).join('')||'<p class="mut">No budgets set for this month.</p>'}</section></div>`},
  incomes:txPage('INCOME','Income'),
  expenses:txPage('EXPENSE','Expenses'),
  categories:async()=>{const cs=await call('GET','/categories');
    const col=(t,l)=>`<section class="card"><h3>${l}</h3>${cs.filter(c=>c.type===t).map(c=>`<div class="row item"><span>${esc(c.name)}</span><button class="l d" data-act="del" data-id="${c.id}">Delete</button></div>`).join('')||'<p class="mut">None yet.</p>'}</section>`;
    return`<h2>Categories</h2><form class="card form" data-form="cat"><input name="name" maxlength="50" placeholder="Category name" style="flex:1;min-width:150px" required><select name="type"><option value="EXPENSE">Expense</option><option value="INCOME">Income</option></select><button class="p">Add</button></form>
    <div class="g2">${col('EXPENSE','Expense categories')}${col('INCOME','Income categories')}</div>`},
  budgets:async()=>{const[y,m]=S.month.split('-').map(Number);
    const[bs,cs]=await Promise.all([call('GET',`/budgets?year=${y}&month=${m}`),call('GET','/categories')]);
    const e=S.edit&&bs.find(b=>b.id===S.edit)||{};
    return`<div class="row"><h2>Budgets</h2><input type="month" value="${S.month}" data-act="month"></div>
    <form class="card form" data-form="bud"><select name="categoryId" required><option value="">Expense category…</option>${opts(cs.filter(c=>c.type==='EXPENSE'),e.categoryId)}</select>
    <input name="limitAmount" type="number" step="0.01" min="0.01" placeholder="Monthly limit" value="${e.limitAmount??''}" required><button class="p">${S.edit?'Save':'Set budget'}</button>${S.edit?'<button type="button" data-act="cancel">Cancel</button>':''}</form>
    <section class="card">${bs.map(b=>`${bar(b)}<div class="acts" style="justify-content:flex-end"><button class="l" data-act="edit" data-id="${b.id}">Edit</button><button class="l d" data-act="del" data-id="${b.id}">Delete</button></div>`).join('')||'<p class="mut">No budgets for this month.</p>'}</section>`}
};
const NAV=[['dashboard','Dashboard'],['incomes','Income'],['expenses','Expenses'],['categories','Categories'],['budgets','Budgets']];
function authHtml(){const reg=S.mode==='register';
  return`<div class="auth"><form data-form="auth"><h1>Finova</h1><p class="mut" style="margin:0">Smart personal finance management</p>
  ${reg?'<input name="name" placeholder="Full name" required>':''}<input name="email" type="email" placeholder="Email" required>
  <input name="password" type="password" placeholder="Password (min 8 characters)" ${reg?'minlength="8"':''} required><div id="err" class="err" hidden></div>
  <button class="p">${reg?'Create account':'Log in'}</button><button type="button" class="l" data-act="mode">${reg?'Have an account? Log in':'New here? Create an account'}</button></form></div>`}
async function render(){
  const app=$('#app');
  if(!S.token){app.innerHTML=authHtml();return}
  app.innerHTML=`<header><h1>Finova</h1><nav>${NAV.map(([k,l])=>`<button class="${S.page===k?'on':''}" data-act="nav" data-id="${k}">${l}</button>`).join('')}</nav><span class="mut">${esc(S.name)}</span><button class="l" data-act="logout">Log out</button></header><main><div id="err" class="err" hidden></div><div id="main"><p class="mut">Loading…</p></div></main>`;
  try{$('#main').innerHTML=await pages[S.page]()}catch(e){if(S.token)flash(e.message)}
}
document.addEventListener('click',async e=>{
  const a=e.target.closest('[data-act]');if(!a||a.tagName==='INPUT')return;
  const act=a.dataset.act,id=Number(a.dataset.id);
  if(act==='nav'){S.page=a.dataset.id;S.edit=null}
  else if(act==='logout')return logout();
  else if(act==='mode')S.mode=S.mode==='login'?'register':'login';
  else if(act==='edit')S.edit=id;
  else if(act==='cancel')S.edit=null;
  else if(act==='del'){
    if(!a.dataset.sure){a.dataset.sure=1;a.textContent='Confirm?';return}
    const path={incomes:'incomes',expenses:'expenses',categories:'categories',budgets:'budgets'}[S.page];
    try{await call('DELETE',`/${path}/${id}`)}catch(err){return flash(err.message)}
  }else return;
  render();
});
document.addEventListener('change',e=>{if(e.target.dataset.act==='month'&&e.target.value){S.month=e.target.value;S.edit=null;render()}});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f));
  try{
    switch(f.dataset.form){
      case'auth':{const r=await api('POST','/auth/'+S.mode,S.mode==='login'?{email:d.email,password:d.password}:d);
        S.token=r.token;S.name=r.name;S.page='dashboard';ls.set('finova_session',JSON.stringify({token:r.token,name:r.name}));break}
      case'tx':await call(S.edit?'PUT':'POST',`/${kindOf()}${S.edit?'/'+S.edit:''}`,{amount:d.amount,description:d.description,date:d.date,categoryId:d.categoryId||null});S.edit=null;break;
      case'cat':await call('POST','/categories',d);break;
      case'bud':{const[year,month]=S.month.split('-').map(Number);await call(S.edit?'PUT':'POST',`/budgets${S.edit?'/'+S.edit:''}`,{categoryId:d.categoryId,year,month,limitAmount:d.limitAmount});S.edit=null;break}
    }
    render();
  }catch(err){flash(err.message)}
});
render();
</script>
</body>
</html>
